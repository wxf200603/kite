name: Build Release APK

# Full release build that compiles native .so libraries from source.
#
# This workflow clones the upstream llama.cpp and QuickJS sources at CI time
# (they are not vendored in this repo), lets Gradle + the Android NDK compile
# libLlamaWrapper.so and libquickjsjni.so (plus termux_pty), and packages
# everything into a single arm64-v8a release APK.
#
# No precompiled .so files are committed to git — all native libs are built
# from source during the CI run.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Accept Android SDK licenses (for NDK auto-download)
        run: |
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Provide placeholder secrets
        run: cp lib/secrets/fallback.dart.example lib/secrets/fallback.dart

      - name: Clone llama.cpp sources
        # The :llama module's CMakeLists.txt expects llama.cpp at
        # android/llama/llama.cpp-src/. We clone a recent release that has the
        # modern llama_model_get_vocab / llama_sampler_* / common_chat_* API
        # used by llama_jni_stub.cpp.
        run: |
          git clone --depth 1 --branch b4526 \
            https://github.com/ggml-org/llama.cpp.git \
            android/llama/llama.cpp-src

      - name: Clone QuickJS sources
        # The :quickjs module's CMakeLists.txt expects QuickJS at
        # android/quickjs/src/main/cpp/quickjs-src/.
        run: |
          git clone --depth 1 \
            https://github.com/bellard/quickjs.git \
            android/quickjs/src/main/cpp/quickjs-src

      - name: Build release APK (compiles native libs from source)
        # kiteSkeletonBuild is NOT set, so the :llama, :quickjs, and termux_pty
        # modules compile from source. AGP auto-downloads the NDK
        # (ndkVersion 28.2.13676358 from app/build.gradle.kts).
        run: flutter build apk --release --target-platform android-arm64

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find build/app/outputs -name "*.apk" 2>/dev/null | head -n1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs -name "*.apk" 2>/dev/null | head -n1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 14

      - name: Print build summary
        run: |
          echo "## Release APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: ${{ steps.apk.outputs.apk_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native .so: compiled from source (llama.cpp + QuickJS + termux_pty)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ABI: arm64-v8a only" >> "$GITHUB_STEP_SUMMARY"
